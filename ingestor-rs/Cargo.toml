[package]
name = "clickhouse-ingestor"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
serde_json = "1"

[dependencies]
async-trait = "0.1.92"
clickhouse = "0.15.3"
config = "0.15.27"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
