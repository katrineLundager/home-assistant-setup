#############################################################################
#############################################################################
##                Elictricity prices and corresponding consuption          ##
#############################################################################
#############################################################################
  - title: Energy
    path: energy
    type: sections
    dense_section_placement: true
    max_columns: 4
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: auto
            apex_config:
              chart:
                height: 350px
            header:
              show: true
              title: Electricity prices
              show_states: true
              colorize_states: true
            graph_span: 48h
            span:
              start: day
            now:
              show: true
              label: Now
            yaxis:
              - id: price
                min: 0
                apex_config:
                  title:
                    show: true
                    text: Price /DKK
              - id: consumption
                opposite: true
                apex_config:
                  title:
                    show: true
                    text: Consumption /kWh
            hours_12: false
            series:
              - entity: sensor.nordpool_kwh_dk1_dkk_3_10_0
                extend_to: false
                yaxis_id: price
                name: Current prices
                data_generator: |
                  const rawToday = entity.attributes.raw_today || [];
                  const rawTomorrow = entity.attributes.raw_tomorrow || [];
                  const historical = rawToday
                  .map(item => [new Date(item.start).getTime(), item.value]);
    
                  return [...historical];
              - entity: sensor.nordpool_kwh_dk1_dkk_3_10_0
                extend_to: false
                yaxis_id: price
                name: Tomorrows prices
                data_generator: |
                  const rawTomorrow = entity.attributes.raw_tomorrow || [];
    
                  const forecast = rawTomorrow
                    .slice(0, 200)
                    .map(item => [new Date(item.start).getTime(), item.value]);
    
                  return [...forecast]
              - entity: sensor.clickhouse_hourly_consumption_from_nrgi
                extend_to: false
                yaxis_id: consumption
                type: column
                name: Hourly consumption data (kWh)
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.consumption || [];
                  const forecast = hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ])
                  return [...forecast]
      - type: grid
        column_span: 2
        cards:
          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: auto
            apex_config:
              chart:
                height: 350px
            header:
              show: true
              title: Historic electricity prices
              show_states: true
              colorize_states: true
            graph_span: 1mth
            span:
              start: hour
              offset: "-1mth"
            now:
              show: true
              label: Now
            hours_12: false
            experimental:
              brush: true
            brush:
              selection_span: 5d
            yaxis:
              - id: consumption
                apex_config:
                  title:
                    show: true
                    text: Consumption /kWh
            series:
              - entity: sensor.clickhouse_nordpool_history
                extend_to: false
                name: Historic prices
                yaxis_id: consumption
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.price || [];
                  const historical = hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ]);
                  return [...historical];
                show:
                  in_brush: true
      - type: grid
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: auto
            apex_config:
              chart:
                height: 350px
            header:
              show: true
              title: Electricity consumption
              show_states: true
              colorize_states: true
            graph_span: 5d
            experimental:
              brush: true
            brush:
              selection_span: 5h
            hours_12: false
            yaxis:
              - id: consumption
                apex_config:
                  title:
                    show: true
                    text: Consumption /kWh
            series:
              - entity: sensor.smart_meter_ts_65a_3_real_power
                extend_to: false
                name: Hourly consumption data
                yaxis_id: consumption
                show:
                  in_brush: true
 

