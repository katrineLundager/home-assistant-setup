title: My Home 
views:
  - title: Energy
    path: energy
    type: sections
    dense_section_placement: true
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 8
            apex_config:
              chart:
                height: 350px
            header:
              show: true
              title: Electricity prices
              show_states: true
              colorize_states: true
            graph_span: 48h
            span:
              start: hour
              offset: "-12h"
            now:
              show: true
              label: Now
            hours_12: false
            series:
              - entity: sensor.nordpool_kwh_dk1_dkk_3_10_0
                extend_to: false
                name: Current prices
                data_generator: |
                  const rawToday = entity.attributes.raw_today || [];
                  const rawTomorrow = entity.attributes.raw_tomorrow || [];
                  const now = new Date();
                  const twelveHoursAgo = new Date(now.getTime() - 12 * 60 * 60 * 1000);
                  const midnight = new Date(now.getTime());
                  midnight.setHours(23,59,0);

                  const historical = rawToday
                  .filter(item => {
                    const start = new Date(item.start);
                    return start >= twelveHoursAgo && start <= midnight
                  })
                  .map(item => [new Date(item.start).getTime(), item.value]);


                  return [...historical];


              - entity: sensor.nordpool_kwh_dk1_dkk_3_10_0
                extend_to: false
                name: Tomorrows prices
                data_generator: |
                  const rawTomorrow = entity.attributes.raw_tomorrow || [];

                  const forecast = rawTomorrow
                    .slice(0, 200)
                    .map(item => [new Date(item.start).getTime(), item.value]);

                  return [...forecast]




          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 8
            apex_config:
              chart:
                height: 350px
            header:
              show: true
              title: Electricity consumption 
              show_states: true
              colorize_states: true
            graph_span: 48h
            span:
              start: hour
              offset: "-5d"
            now:
              show: true
              label: Now
            hours_12: false
            series:

              - entity: sensor.clickhouse_hourly_consumption_from_nrgi
                extend_to: false
                name: Hourly consumption data
                data_generator: |
                    const hours = entity.attributes.hour || [];
                    const vals = entity.attributes.consumption || [];
                    const forecast = hours.map((h, i) => [
                      new Date(h).getTime(),
                      Number(vals[i])
                    ])

      - type: grid
        column_span: 2
        cards:

          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 8
            apex_config:
              chart:
                height: 250px
            header:
              show: true
              title: Motorcycle
              show_states: true
              colorize_states: true
            graph_span: 48h
            span:
              start: hour
            now:
              show: true
              label: Now
            hours_12: false
            series:
              - entity: sensor.clickhouse_motorcycle_energy
                extend_to: false
                name: Motorcycle consumption
                type: column
                data_generator: |
                  const minutes = entity.attributes.minute|| [];
                  const vals = entity.attributes.consumption || [];
                  return minutes.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ])



  - title: Consumption
    path: consumption
    max_colums: 4
    type: sections
    sections:


    - type: grid
      column_span: 2
      cards:
        - type: custom:apexcharts-card
          grid_options:
            columns: full
            rows: 7
          apex_config:
            chart:
              height: 550px
            legend:
              show: true
              position: bottom
          header:
            show: true
            title: Accumulated consumption by year (NRGI)
          graph_span: 1yr
          span:
            start: year
          series:
            - entity: sensor.clickhouse_monthly_consumption_from_nrgi
              name: This year
              type: line
              curve: straight
              extend_to: false
              data_generator: |
                const months = entity.attributes.month || [];
                const vals = entity.attributes.consumption || [];
                const cur = new Date().getFullYear();
                const src = cur - 0;
                const pts = months
                  .map((m, i) => [Number(m.slice(0, 4)), Number(m.slice(5, 7)), Number(vals[i])])
                  .filter(p => p[0] === src)
                  .sort((a, b) => a[1] - b[1])
                  .map(p => [new Date(cur, p[1] - 1, 1).getTime(), p[2]]);
                let acc = 0;
                return pts.map(p => [p[0], acc += p[1]]);
            - entity: sensor.clickhouse_monthly_consumption_from_nrgi
              name: Last year
              type: line
              curve: straight
              extend_to: false
              data_generator: |
                const months = entity.attributes.month || [];
                const vals = entity.attributes.consumption || [];
                const cur = new Date().getFullYear();
                const src = cur - 1;
                const pts = months
