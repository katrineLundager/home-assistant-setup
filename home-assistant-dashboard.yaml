#############################################################################
##                           Historic consumption                          ##
#############################################################################
#############################################################################



  - title: Historic Consumption
    path: consumption
    max_colums: 4
    type: sections
    sections:


    - type: grid
      column_span: 2
      cards:
        - type: custom:apexcharts-card
          grid_options:
            columns: full
            rows: 10
          apex_config:
            chart:
              height: 550px
            legend:
              show: true
              position: bottom
          header:
            show: true
            title: Accumulated consumption by year (NRGI)
          graph_span: 1yr
          span:
            start: year
          series:
            - entity: sensor.clickhouse_monthly_consumption_from_nrgi
              name: This year
              type: line
              curve: straight
              extend_to: false
              data_generator: |
                const months = entity.attributes.month || [];
                const vals = entity.attributes.consumption || [];
                const cur = new Date().getFullYear();
                const src = cur - 0;
                const pts = months
                  .map((m, i) => [Number(m.slice(0, 4)), Number(m.slice(5, 7)), Number(vals[i])])
                  .filter(p => p[0] === src)
                  .sort((a, b) => a[1] - b[1])
                  .map(p => [new Date(cur, p[1] - 1, 1).getTime(), p[2]]);
                let acc = 0;
                return pts.map(p => [p[0], acc += p[1]]);
            - entity: sensor.clickhouse_monthly_consumption_from_nrgi
              name: Last year
              type: line
              curve: straight
              extend_to: false
              data_generator: |
                const months = entity.attributes.month || [];
                const vals = entity.attributes.consumption || [];
                const cur = new Date().getFullYear();
                const src = cur - 1;
                const pts = months
                  .map((m, i) => [Number(m.slice(0, 4)), Number(m.slice(5, 7)), Number(vals[i])])
                  .filter(p => p[0] === src)
                  .sort((a, b) => a[1] - b[1])
                  .map(p => [new Date(cur, p[1] - 1, 1).getTime(), p[2]]);
                let acc = 0;
                return pts.map(p => [p[0], acc += p[1]]);
            - entity: sensor.clickhouse_monthly_consumption_from_nrgi
              name: 2 years ago
              type: line
              curve: straight
              extend_to: false
              data_generator: |
                const months = entity.attributes.month || [];
                const vals = entity.attributes.consumption || [];
                const cur = new Date().getFullYear();
                const src = cur - 2;
                const pts = months
                  .map((m, i) => [Number(m.slice(0, 4)), Number(m.slice(5, 7)), Number(vals[i])])
                  .filter(p => p[0] === src)
                  .sort((a, b) => a[1] - b[1])
                  .map(p => [new Date(cur, p[1] - 1, 1).getTime(), p[2]]);
                let acc = 0;
                return pts.map(p => [p[0], acc += p[1]]);
            - entity: sensor.clickhouse_monthly_consumption_from_nrgi
              name: 3 years ago
              type: line
              curve: straight
              extend_to: false
              data_generator: |
                const months = entity.attributes.month || [];
                const vals = entity.attributes.consumption || [];
                const cur = new Date().getFullYear();
                const src = cur - 3;
                const pts = months
                  .map((m, i) => [Number(m.slice(0, 4)), Number(m.slice(5, 7)), Number(vals[i])])
                  .filter(p => p[0] === src)
                  .sort((a, b) => a[1] - b[1])
                  .map(p => [new Date(cur, p[1] - 1, 1).getTime(), p[2]]);
                let acc = 0;
                return pts.map(p => [p[0], acc += p[1]]);
            - entity: sensor.clickhouse_monthly_consumption_from_nrgi
              name: 4 years ago
              type: line
              curve: straight
              extend_to: false
              data_generator: |
                const months = entity.attributes.month || [];
                const vals = entity.attributes.consumption || [];
                const cur = new Date().getFullYear();
                const src = cur - 4;
                const pts = months
                  .map((m, i) => [Number(m.slice(0, 4)), Number(m.slice(5, 7)), Number(vals[i])])
                  .filter(p => p[0] === src)
                  .sort((a, b) => a[1] - b[1])
                  .map(p => [new Date(cur, p[1] - 1, 1).getTime(), p[2]]);
                let acc = 0;
                return pts.map(p => [p[0], acc += p[1]]);


    - type: grid
      column_span: 2
      cards:
      - type: custom:apexcharts-card
        grid_options:
          columns: full
          rows: 10
        apex_config:
          chart:
            height: 550px
          legend:
            show: true
            position: bottom
        header:
          show: true
          title: Monthly consumption by year (NRGI)
        graph_span: 1yr
        span:
          start: year
        series:
          - entity: sensor.clickhouse_monthly_consumption_from_nrgi
            name: 2 years ago
            type: column
            data_generator: |
              const months = entity.attributes.month || [];
              const vals = entity.attributes.consumption || [];
              const cur = new Date().getFullYear();
              const src = cur - 2;
              return months
                .map((m, i) => [Number(m.slice(0, 4)), Number(m.slice(5, 7)), Number(vals[i])])
                .filter(p => p[0] === src)
                .map(p => [new Date(cur, p[1] - 1, 1).getTime(), p[2]]);
          - entity: sensor.clickhouse_monthly_consumption_from_nrgi
            name: Last year
            type: column
            data_generator: |
              const months = entity.attributes.month || [];
              const vals = entity.attributes.consumption || [];
              const cur = new Date().getFullYear();
              const src = cur - 1;
              return months
                .map((m, i) => [Number(m.slice(0, 4)), Number(m.slice(5, 7)), Number(vals[i])])
                .filter(p => p[0] === src)
                .map(p => [new Date(cur, p[1] - 1, 1).getTime(), p[2]]);
          - entity: sensor.clickhouse_monthly_consumption_from_nrgi
            name: This year
            type: column
            data_generator: |
              const months = entity.attributes.month || [];
              const vals = entity.attributes.consumption || [];
              const cur = new Date().getFullYear();
              const src = cur - 0;
              return months
                .map((m, i) => [Number(m.slice(0, 4)), Number(m.slice(5, 7)), Number(vals[i])])
                .filter(p => p[0] === src)
                .map(p => [new Date(cur, p[1] - 1, 1).getTime(), p[2]]);


    - type: grid
      column_span: 2
      cards:

          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 6
            apex_config:
              chart:
                height: 250px
            header:
              show: true
              title: Car Energy
              show_states: true
              colorize_states: true
            graph_span: 14d
            span:
              start: day
              offset: -14d
            now:
              show: true
              label: Now
            hours_12: false
            series:
              - entity: sensor.clickhouse_car_energy
                extend_to: false
                name: Motorcycle energy
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.energy || [];
                  return hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ])


    - type: grid
      column_span: 2
      cards:

          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 8
            apex_config:
              chart:
                height: 250px
            header:
              show: true
              title: Motorcycle Energy
              show_states: true
              colorize_states: true
            graph_span: 14d
            span:
              start: day
              offset: -14d
            now:
              show: true
              label: Now
            hours_12: false
            series:
              - entity: sensor.clickhouse_motorcycle_energy
                extend_to: false
                name: Motorcycle energy
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.energy || [];
                  return hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ])






