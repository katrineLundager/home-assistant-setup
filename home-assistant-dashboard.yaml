  # ── ClickHouse-backed charts ────────────────────────────────────
  # Data comes from command_line sensors (see container.nix) that query
  # ClickHouse server-side and expose parallel arrays as attributes
  # (day/consumption, hour/elevation, hour/temperature, hour/price).
  # The data_generators read them synchronously — no browser fetch / CORS.
  - title: ClickHouse
    path: clickhouse
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 7
            apex_config:
              chart:
                height: 350px
            header:
              show: true
              title: Consumption (NRGI, hourly)
            graph_span: 14d
            now:
              show: true
              label: Now
            series:
              - entity: sensor.clickhouse_hourly_consumption_from_nrgi
                name: Consumption (kWh)
                type: column
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.consumption || [];
                  return hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ]);
          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 7
            header:
              show: true
              title: Sunlight (lux) and sun elevation
            graph_span: 14d
            apex_config:
              chart:
                height: 350px
            now:
              show: true
              label: Now
            yaxis:
              - id: primary
              - id: secondary
                opposite: true
            series:
              - entity: sensor.clickhouse_lux_0xfd01
                name: Lux
                yaxis_id: primary
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.lux || [];
                  return hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ]);
              - entity: sensor.clickhouse_sun_elevation
                name: Elevation (°)
                yaxis_id: secondary
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.elevation || [];
                  return hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ]);
          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 7
            apex_config:
              chart:
                height: 350px
            header:
              show: true
              title: Temperature (0xfd01)
            graph_span: 14d
            now:
              show: true
              label: Now
            series:
              - entity: sensor.clickhouse_temperature_0xfd01
                name: Temperature (°C)
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.temperature || [];
                  return hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ]);
