              data_generator: |
                const months = entity.attributes.month || [];
                const vals = entity.attributes.consumption || [];
                const cur = new Date().getFullYear();
                const src = cur - 4;
                const pts = months
                  .map((m, i) => [Number(m.slice(0, 4)), Number(m.slice(5, 7)), Number(vals[i])])
                  .filter(p => p[0] === src)
                  .sort((a, b) => a[1] - b[1])
                  .map(p => [new Date(cur, p[1] - 1, 1).getTime(), p[2]]);
                let acc = 0;
                return pts.map(p => [p[0], acc += p[1]]);


    - type: grid
      column_span: 2
      cards:
      - type: custom:apexcharts-card
        grid_options:
          columns: full
          rows: 7
        apex_config:
          chart:
            height: 550px
          legend:
            show: true
            position: bottom
        header:
          show: true
          title: Monthly consumption by year (NRGI)
        graph_span: 1yr
        span:
          start: year
        series:
          - entity: sensor.clickhouse_monthly_consumption_from_nrgi
