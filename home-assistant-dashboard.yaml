  - title: Electricity
    cards:
      # Raw spot price for the day
      - type: custom:mini-graph-card
        name: Spot price (DK1)
        entities:
          - entity: sensor.nordpool_kwh_dk1_dkk_3_10_0
            name: Now
        hours_to_show: 24
        points_per_hour: 12
        unit: DKK/kWh
        show:
          fill: fade

          # Consumption vs price over time
      - type: statistics-graph
        title: Consumption (sum per day)
        entities:
          - sensor.main_energy
        stat_type: sum
        period: day
        days_to_show: 14

        # History of the price sensor itself
      - type: history-graph
        title: Price history
        hours_to_show: 48
        entities:
          - sensor.nordpool_kwh_dk1_dkk_3_10_0
