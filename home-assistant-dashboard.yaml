title: My Home 
views:
  - title: Energy
    path: energy
    type: sections
    dense_section_placement: true
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: custom:apexcharts-card
            column_span: 4
            grid_options:
              columns: full
              rows: 7
            apex_config:
              chart:
                height: 350px
            header:
              show: true
              title: Electricity prices
              show_states: true
              colorize_states: true
            graph_span: 48h
            span:
              start: hour
              offset: "-12h"
            now:
              show: true
              label: Now
            hours_12: false
            series:
              - entity: sensor.nordpool_kwh_dk1_dkk_3_10_0
                extend_to: false
                name: Current prices
                data_generator: |
                  const rawToday = entity.attributes.raw_today || [];
                  const rawTomorrow = entity.attributes.raw_tomorrow || [];
                  const now = new Date();
                  const twelveHoursAgo = new Date(now.getTime() - 12 * 60 * 60 * 1000);
                  const midnight = new Date(now.getTime());
                  midnight.setHours(23,59,0);

                  const historical = rawToday
                  .filter(item => {
                    const start = new Date(item.start);
                    return start >= twelveHoursAgo && start <= midnight
                  })
                  .map(item => [new Date(item.start).getTime(), item.value]);


                  return [...historical];


              - entity: sensor.nordpool_kwh_dk1_dkk_3_10_0
                extend_to: false
                name: Tomorrows prices
                data_generator: |
                  const rawTomorrow = entity.attributes.raw_tomorrow || [];

                  const forecast = rawTomorrow
                    .slice(0, 200)
                    .map(item => [new Date(item.start).getTime(), item.value]);

                  return [...forecast]



          - type: custom:apexcharts-card
            column_span: 4
            grid_options:
              columns: full
              rows: 7
            apex_config:
              chart:
                height: 350px
            header:
              show: true
              title: Electricity consumption 
              show_states: true
              colorize_states: true
            graph_span: 48h
            span:
              start: hour
              offset: "-5d"
            now:
              show: true
              label: Now
            hours_12: false
            series:

              - entity: sensor.clickhouse_hourly_consumption_from_nrgi
                extend_to: false
                name: Hourly consumption data
                data_generator: |
                    const hours = entity.attributes.hour || [];
                    const vals = entity.attributes.consumption || [];
                    const forecast = hours.map((h, i) => [
                      new Date(h).getTime(),
                      Number(vals[i])
                    ])
                    return [...forecast]




  - title: Electricity
    cards:
      # Raw spot price for the day
      - type: custom:mini-graph-card
        name: Spot price (DK1)
        entities:
          - entity: sensor.nordpool_kwh_dk1_dkk_3_10_0
            name: Now
        hours_to_show: 24
        points_per_hour: 12
        unit: DKK/kWh
        show:
          fill: fade

          # Consumption vs price over time
      - type: statistics-graph
        title: Consumption (sum per day)
        entities:
          - sensor.main_energy
        stat_type: sum
        period: day
        days_to_show: 14

        # History of the price sensor itself
      - type: history-graph
        title: Price history
        hours_to_show: 48
        entities:
          - sensor.nordpool_kwh_dk1_dkk_3_10_0

  # ── ClickHouse-backed charts ────────────────────────────────────
  # Data comes from command_line sensors (see container.nix) that query
  # ClickHouse server-side and expose parallel arrays as attributes
  # (day/consumption, hour/elevation, hour/temperature, hour/price).
  # The data_generators read them synchronously — no browser fetch / CORS.
  - title: ClickHouse
    path: clickhouse
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 7
            apex_config:
              chart:
                height: 350px
            header:
              show: true
              title: Consumption (NRGI, hourly)
            graph_span: 14d
            now:
              show: true
              label: Now
            series:
              - entity: sensor.clickhouse_hourly_consumption_from_nrgi
                name: Consumption (kWh)
                type: column
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.consumption || [];
                  return hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ]);
          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 7
            header:
              show: true
              title: Sunlight (lux) and sun elevation
            graph_span: 14d
            apex_config:
              chart:
                height: 350px
            now:
              show: true
              label: Now
            yaxis:
              - id: primary
              - id: secondary
                opposite: true
            series:
              - entity: sensor.clickhouse_lux_0xfd01
                name: Lux
                yaxis_id: primary
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.lux || [];
                  return hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ]);
              - entity: sensor.clickhouse_sun_elevation
                name: Elevation (°)
                yaxis_id: secondary
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.elevation || [];
                  return hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ]);
          - type: custom:apexcharts-card
            grid_options:
              columns: full
              rows: 7
            apex_config:
              chart:
                height: 350px
            header:
              show: true
              title: Temperature (0xfd01)
            graph_span: 14d
            now:
              show: true
              label: Now
            series:
              - entity: sensor.clickhouse_temperature_0xfd01
                name: Temperature (°C)
                data_generator: |
                  const hours = entity.attributes.hour || [];
                  const vals = entity.attributes.temperature || [];
                  return hours.map((h, i) => [
                    new Date(h).getTime(),
                    Number(vals[i])
                  ]);
